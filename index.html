e:pre-wrap}.item-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.empty{padding:25px;text-align:center;color:#738895;background:#f6f8f8;border-radius:12px;font-size:.86rem}.tag-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.modal-backdrop{position:fixed;inset:0;z-index:60;background:#0a2737ad;display:flex;justify-content:center;align-items:center;padding:18px}.modal{background:#fff;border-radius:19px;box-shadow:0 18px 80px #0004;max-width:560px;width:100%;padding:23px;max-height:92dvh;overflow:auto}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:15px}.close{border:0;background:#eef2f2;border-radius:50%;height:34px;width:34px;font-size:1.3rem;color:#5a7380}.gate{min-height:calc(100vh - 76px);display:flex;align-items:flex-start;justify-content:center;padding:65px 18px}.gate-box{width:min(100%,480px);padding:30px;background:white;border:1px solid #e3e9eb;border-radius:21px;box-shadow:0 8px 30px #0001}.gate-box h1{margin:0 0 9px}.gate-box .form-field{margin-bottom:16px}.gate-actions{display:flex;gap:10px;flex-wrap:wrap}.codebox{background:#edf3f4;padding:14px;border-radius:11px;word-break:break-all;font-family:ui-monospace,monospace;font-size:.82rem}.notice{background:#fff3e5;padding:12px 15px;border-radius:10px;color:#8d642d;font-size:.82rem;margin:12px 0}.choice{display:flex;gap:10px;align-items:center}.choice input{width:auto}#toast{position:fixed;bottom:25px;right:24px;z-index:80;background:#163649;color:white;border-radius:11px;padding:12px 19px;box-shadow:0 12px 30px #0002;display:none;font-size:.85rem;max-width:85vw}#toast.show{display:block}.danger-text{color:#a75548}.frequency{color:#738995;font-size:.78rem}.nutrition-note{background:#f7f4ee;border-radius:12px;padding:14px;color:#685d4d;font-size:.81rem}.right{margin-left:auto}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nowrap{white-space:nowrap}@media(max-width:950px){.grid.two{grid-template-column <body>
<div id="app">
  <header class="topbar"><div class="brand"><div class="brand-icon">G</div><div><div class="brand-name">Gavriel <span>Family Hub</span></div><div class="brand-sub">One calm, consistent family plan</div></div></div><div class="top-actions"><span class="status" id="syncStatus">Preview • This device only</span><button id="signoutBtn" class="text-button hidden">Sign out</button></div></header>
  <div id="entryGate" class="gate hidden"></div>
  <div id="workspace">
    <div class="frame">
      <aside class="sidebar"><nav id="nav" aria-label="Main navigation"></nav><div class="sidebar-foot"><div class="tiny-title">Family agreement</div><p>Safety first. Calm voices. Predictable limits. Practice and praise.</p></div></aside>
      <main id="view" tabindex="-1"></main>
    </div>
    <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>
</div>
<div id="modalRoot"></div><div id="toast" role="status" aria-live="polite"></div>
<script>// Paste credentials from a NEW dedicated Supabase project here.
// The publishable key is designed for browser use. NEVER use a secret/service-role key.
window.GAVRIEL_CONFIG = {
  supabaseUrl: "",
  supabasePublishableKey: ""
};
</script>
<script type="module">
/* Gavriel Family Hub · static PWA · private cloud mode or local preview */
const CONFIG=window.GAVRIEL_CONFIG||{};
const CLOUD=Boolean(CONFIG.supabaseUrl&&CONFIG.supabasePublishableKey);
const DEMO_KEY='gavriel-hub-preview-v1';
const pages=[['home','⌂','Today'],['calendar','▦','Calendar'],['screens','◷','Screens'],['food','♧','Food'],['needs','◇','Needs'],['incidents','◎','Log'],['settings','⚙','Settings']];
const types={school:'School',screen:'Screen time',meal:'Meal',activity:'Activity',therapy:'Appointment',other:'Other'};
const safetySteps=['Separate children calmly and check the sibling who was hurt.','Say one brief line: “I won’t let you hit. We keep everyone safe.”','Reduce talking and demands until everyone is calm.','Later, practice a safer way to ask for attention or space.','Record what happened immediately before and after, without blame.'];
const state={mode:CLOUD?'cloud':'preview',client:null,user:null,household:null,items:[],page:'home',month:new Date(new Date().getFullYear(),new Date().getMonth(),1),selected:localISO(new Date()),filter:'all',gate:'login',busy:false};
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.DateTimeFormat('en-IL',{month:'short',day:'numeric',year:'numeric'}).format(n);
const formatDate=s=>s?fmt(new Date(`${s}T12:00:00`)):'';
const readableTime=s=>s||'';
const field=(name,label,value='',attrs='',wide=false,tag='input')=>`<div class="form-field${wide?' wide':''}"><label for="field-${e(name)}">${e(label)}</label>${tag==='textarea'?`<textarea id="field-${e(name)}" name="${e(name)}" ${attrs}>${e(value)}</textarea>`:`<input id="field-${e(name)}" name="${e(name)}" value="${e(value)}" ${attrs}>`}</div>`;
const dropdown=(name,label,options,value,wide=false)=>`<div class="form-field${wide?' wide':''}"><label for="field-${name}">${e(label)}</label><select name="${name}" id="field-${name}">${options.map(o=>`<option value="${e(o[0])}" ${value===o[0]?'selected':''}>${e(o[1])}</option>`).join('')}</select></div>`;
function localISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function nowTime(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
const uid=()=>crypto.randomUUID();
const records=k=>state.items.filter(x=>x.kind===k);
const itemById=id=>state.items.find(x=>x.id===id);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),3200)}
function setStatus(label,cls=''){const x=$('#syncStatus');x.textContent=label;x.className='status '+cls}
function renderNav(){const nav=pages.map(([id,symbol,label])=>`<button class="nav-btn ${state.page===id?'active':''}" data-page="${id}" type="button"><span class="nav-symbol">${symbol}</span><span>${label}</span></button>`).join('');$('#nav').innerHTML=nav;$('#mobileNav').innerHTML=nav}
function header(title,subtitle,action=''){return `<div class="page-heading"><div><div class="eyebrow">Gavriel's shared family plan</div><h1>${title}</h1><p class="muted small">${subtitle}</p></div>${action}</div>`}
function cardTitle(title,right=''){return `<div class="card-title"><h2>${title}</h2>${right}</div>`}
function empty(text){return `<div class="empty">${e(text)}</div>`}
function occurs(x,date){if(x.kind!=='schedule')return false;const p=x.payload;if(p.date===date)return true;if(p.repeat==='weekly'&&p.date<date){return new Date(p.date+'T12:00:00').getDay()===new Date(date+'T12:00:00').getDay()}return false}
function daily(date){return records('schedule').filter(x=>occurs(x,date)).sort((a,b)=>(a.payload.time||'').localeCompare(b.payload.time||''))}
function agendaItem(x,actions=false){const p=x.payload;return `<div class="agenda-item"><span class="dot ${e(p.category||'other')}"></span><div class="agenda-body"><div class="agenda-title">${e(p.title)}</div><div class="agenda-sub">${p.time?e(p.time):'All day'}${p.end_time?' – '+e(p.end_time):''} · ${e(types[p.category]||'Other')}${p.repeat==='weekly'?' · Weekly':''}${p.note?' · '+e(p.note):''}</div></div>${actions?`<div class="agenda-actions"><button class="button secondary small" data-action="edit-event" data-id="${x.id}">Edit</button></div>`:''}</div>`}
function nextEvents(){const list=[];for(let i=0;i<8;i++){const d=new Date();d.setDate(d.getDate()+i);const date=localISO(d);for(const it of daily(date))list.push({it,date})}return list.slice(0,5)}
function getActive(){return records('screen').filter(x=>x.payload.status==='running').sort((a,b)=>b.payload.started_at.localeCompare(a.payload.started_at))[0]}
function activeRemaining(x){return Math.floor((new Date(x.payload.ends_at).getTime()-Date.now())/1000)}
function timerText(sec){const sign=sec<0?'−':'';const abs=Math.abs(sec);return sign+String(Math.floor(abs/3600)).padStart(2,'0')+':'+String(Math.floor(abs%3600/60)).padStart(2,'0')+':'+String(abs%60).padStart(2,'0')}
function screenWidget(brief=false){const a=getActive();if(!a)return `<div class="${brief?'':'callout'}"><div class="eyebrow">No active device session</div><p class="${brief?'muted':''} small">Agree on the end time before handing over the controller.</p><button class="button ${brief?'secondary':''}" data-action="new-session">Start a device session</button></div>`;const p=a.payload,remaining=activeRemaining(a),duration=(new Date(p.ends_at)-new Date(p.started_at))/1000,percent=Math.max(0,Math.min(100,100*remaining/duration));return `<div class="eyebrow">${e(p.game||'Device')} • session ${remaining>0?'running':'finished'}</div><div class="timer ${remaining<=0?'expired':''}" id="liveTimer">${remaining>0?timerText(remaining):'Time is up'}</div><div class="progress"><div class="progress-fill" id="timerFill" style="width:${percent}%"></div></div><p class="small ${brief?'':'muted'}">Expected handover: ${new Date(p.ends_at).toLocaleTimeString('en-IL',{hour:'2-digit',minute:'2-digit'})}. A timer is a cue, not permission to grab the device.</p><button class="button ${brief?'secondary':'soft'}" data-action="finish-session" data-id="${a.id}">Handover completed</button>`}
function renderHome(){const upcoming=nextEvents(),today=localISO(new Date());return `${header('Today, together',`${new Date().toLocaleDateString('en-IL',{weekday:'long',month:'long',day:'numeric'})} · Clear routines and calm, shared boundaries`,`<button class="button" data-action="new-event">+ Add schedule</button>`)}<div class="grid two"><div class="stack"><div class="card feature">${cardTitle('Device time',`<span class="pill">${CLOUD?'Shared across phones':'Preview only'}</span>`)}${screenWidget(true)}</div><div class="card">${cardTitle('Today & coming up',`<button class="button secondary small" data-page="calendar">Calendar</button>`)}${upcoming.length?upcoming.map(({it,date})=>`<div class="small muted" style="margin:11px 0 0">${date===today?'Today':formatDate(date)}</div>${agendaItem(it)}`).join(''):empty('Nothing scheduled yet. Add school, meals, therapy, movement, and screen time.')}</div></div><div class="stack"><div class="card"><div class="tag-line" style="margin-bottom:12px"><span class="pill coral">Safety first</span><span class="pill">For both parents</span></div>${cardTitle('If hitting happens') }<ol class="steps">${safetySteps.map(s=>`<li>${e(s)}</li>`).join('')}</ol><div class="divider"></div><button class="button secondary small" data-action="new-incident">Record what happened</button></div><div class="card">${cardTitle('Today’s focus')}<div class="callout"><strong>Predictability over punishment</strong><p class="small">Set screen limits before playing. Give warnings. Keep siblings safe. Praise safe choices immediately.</p></div><div class="divider"></div><div class="metric-row"><div class="metric"><strong>${daily(today).length}</strong><div class="muted small">Scheduled items</div></div><div class="metric"><strong>${records('incident').filter(x=>x.payload.date===today).length}</strong><div class="muted small">Logs today</div></div></div></div></div></div>`}
function renderCalendar(){let y=state.month.getFullYear(),m=state.month.getMonth(),offset=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<42;i++){const day=i-offset+1,d=new Date(y,m,day),date=localISO(d),events=daily(date),inside=d.getMonth()===m;cells.push(`<button class="day ${inside?'':'outside'} ${date===localISO(new Date())?'today':''} ${state.selected===date?'selected':''}" data-action="select-day" data-date="${date}"><span class="day-num">${d.getDate()}</span><div class="day-events">${events.slice(0,2).map(x=>`<div class="day-marker">${e(x.payload.title)}</div>`).join('')}${events.length>2?`+${events.length-2} more`:''}</div></button>`)}return `${header('Family calendar','School, FIFA, meals, exercise, appointments, and transitions in one place.',`<button class="button" data-action="new-event">+ Add event</button>`)}<div class="grid two"><div class="card" style="min-width:0"><div class="calendar-head"><h2 style="margin:0">${state.month.toLocaleDateString('en-IL',{month:'long',year:'numeric'})}</h2><div class="cal-controls"><button class="icon-btn" data-action="month-prev" aria-label="Previous month">‹</button><button class="button secondary small" data-action="month-today">Today</button><button class="icon-btn" data-action="month-next" aria-label="Next month">›</button></div></div><div class="cal-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div></div><div class="card">${cardTitle(formatDate(state.selected),`<button class="button secondary small" data-action="new-event" data-date="${state.selected}">+ Add</button>`)}${daily(state.selected).length?daily(state.selected).map(x=>agendaItem(x,true)).join(''):empty('No events this day.')}</div></div>`}
function renderScreens(){const sessions=records('screen').sort((a,b)=>b.payload.started_at.localeCompare(a.payload.started_at)).slice(0,8);return `${header('Devices & FIFA','A visible end time, calm warnings, and predictable handovers.',!getActive()?`<button class="button" data-action="new-session">+ Start session</button>`:'')}<div class="grid two"><div class="card feature">${cardTitle('Current session')} ${screenWidget(true)}</div><div class="card">${cardTitle('How we handle transitions')}<ol class="steps"><li>Say the game and finish time before starting.</li><li>Warn at 10 and 5 minutes; plan to finish the current match.</li><li>At the end: “FIFA is finished. You can play at the next scheduled time.”</li><li>If he protests, stay calm, keep the boundary, and protect siblings.</li><li>When calm, recognize a successful handover.</li></ol><div class="notice">Trial starting limit: 30 minutes. This is adjustable, not a medical recommendation.</div></div></div><div class="card" style="margin-top:18px">${cardTitle('Session history')}${sessions.length?sessions.map(x=>`<div class="agenda-item"><span class="dot screen"></span><div class="agenda-body"><div class="agenda-title">${e(x.payload.game||'Device')}</div><div class="agenda-sub">${new Date(x.payload.started_at).toLocaleString('en-IL',{dateStyle:'medium',timeStyle:'short'})} · ${x.payload.minutes} min · ${x.payload.status==='finished'?'Handover recorded':activeRemaining(x)>0?'Playing':'Time expired — handover pending'}</div></div></div>`).join(''):empty('No sessions recorded yet.')}</div>`}
function renderFood(){const foods=records('food'),cats=[['safe','Reliable foods'],['meal','Meal ideas'],['try','Foods to explore'],['avoid','Avoid / allergies']];return `${header('Food & meals','Track preferences, routines, and food considerations without making assumptions about diet.',`<button class="button" data-action="new-food">+ Add food</button>`)}<div class="grid two">${cats.map(([key,label])=>`<div class="card">${cardTitle(label,`<span class="pill">${foods.filter(x=>x.payload.category===key).length}</span>`)}<div class="stack">${foods.filter(x=>x.payload.category===key).length?foods.filter(x=>x.payload.category===key).map(x=>itemCard(x,'food')).join(''):empty('Nothing recorded yet.')}</div></div>`).join('')}</div><div class="nutrition-note" style="margin-top:18px">No autism-specific diet is presumed. Record confirmed allergies distinctly from ordinary dislikes; discuss dietary restrictions and nutritional concerns with Gavriel's clinician or dietitian.</div>`}
function itemCard(x,kind){return `<div class="item-card"><div class="item-row"><div><h3>${e(x.payload.name)}</h3><p>${e(x.payload.details||x.payload.notes||'')}</p></div><div class="toolbar"><button class="button secondary small" data-action="edit-${kind}" data-id="${x.id}">Edit</button></div></div></div>`}
function renderNeeds(){const groups=[['strength','Interests & strengths'],['trigger','Triggers to notice'],['support','Things that help'],['communication','Communication preferences']];return `${header('Gavriel’s needs','A shared reference for what works for him—not assumptions about autism.',`<button class="button" data-action="new-need">+ Add insight</button>`)}<div class="grid two">${groups.map(([key,label])=>`<div class="card">${cardTitle(label,`<span class="pill">${records('need').filter(x=>x.payload.category===key).length}</span>`)}<div class="stack">${records('need').filter(x=>x.payload.category===key).length?records('need').filter(x=>x.payload.category===key).map(x=>itemCard(x,'need')).join(''):empty('Add what you have personally observed.')}</div></div>`).join('')}</div><div class="card" style="margin-top:18px">${cardTitle('Our shared response plan')}<ol class="steps">${safetySteps.map(s=>`<li>${e(s)}</li>`).join('')}</ol><p class="small muted" style="margin-top:16px">Physical hitting that hurts warrants professional assessment and parent coaching. This tool is for coordination and observation, not diagnosis or treatment.</p></div>`}
function incidentCard(x){const p=x.payload;return `<div class="item-card"><div class="item-row"><div><div class="tag-line"><span class="pill coral">${e(p.level||'Incident')}</span><span class="frequency">${e(p.date)} ${e(p.time||'')}</span></div><h3 style="margin-top:9px">${e(p.behavior||'Behavior recorded')}</h3><p><strong>Before:</strong> ${e(p.before||'Not noted')}<br><strong>After:</strong> ${e(p.after||'Not noted')}${p.notes?'<br><strong>Notes:</strong> '+e(p.notes):''}</p></div><button class="button secondary small" data-action="edit-incident" data-id="${x.id}">Edit</button></div></div>`}
function renderIncidents(){const list=records('incident').sort((a,b)=>((b.payload.date||'')+(b.payload.time||'')).localeCompare((a.payload.date||'')+(a.payload.time||'')));return `${header('Behavior observations','Neutral notes to help discover patterns, not a punishment tracker.',`<button class="button" data-action="new-incident">+ Record incident</button>`)}<div class="callout safety" style="margin-bottom:18px"><strong>Immediate safety</strong><p class="small">When hitting happens, separate children, check injuries, reduce verbal demands, and stay nearby. For imminent serious danger, seek urgent local help.</p></div><div class="grid two"><div class="card">${cardTitle('What to record')}<p class="small muted">Use the ABC pattern: <strong>A</strong>ntecedent (what happened right before), <strong>B</strong>ehavior (what you saw), <strong>C</strong>onsequence (what happened immediately after). Include sleep, pain, food, noise, or transitions if relevant.</p><div class="callout"><strong>Look for patterns</strong><p class="small">Record observations consistently, even when the trigger is unclear. Share them with a qualified autism-experienced professional.</p></div></div><div class="card">${cardTitle('Recent incidents',`<span class="pill">${list.length} logged</span>`)}<div class="stack">${list.length?list.slice(0,30).map(incidentCard).join(''):empty('No incidents recorded.')}</div></div></div>`}
function exportJSON(){const content=JSON.stringify({exported_at:new Date().toISOString(),household_name:state.household?.name||'Preview',records:state.items},null,2);download(`gavriel-hub-backup-${localISO(new Date())}.json`,content,'application/json')}
function icsEscape(v){return String(v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function icsDate(date,time){return date.replaceAll('-','')+(time?'T'+time.replace(':','')+'00':'')}
function exportICS(){const events=records('schedule');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gavriel Family Hub//EN','CALSCALE:GREGORIAN'];for(const x of events){const p=x.payload,allDay=!p.time;lines.push('BEGIN:VEVENT',`UID:${x.id}@gavriel-hub`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z`,`SUMMARY:${icsEscape(p.title)}`,`DTSTART${allDay?';VALUE=DATE':''}:${icsDate(p.date,p.time)}`);if(p.end_time)lines.push(`DTEND:${icsDate(p.date,p.end_time)}`);else if(!allDay){const d=new Date(`${p.date}T${p.time}:00`);d.setMinutes(d.getMinutes()+30);lines.push(`DTEND:${icsDate(localISO(d),nowTimeFrom(d))}`)}else{const d=new Date(p.date+'T12:00:00');d.setDate(d.getDate()+1);lines.push(`DTEND;VALUE=DATE:${icsDate(localISO(d))}`)}if(p.repeat==='weekly')lines.push('RRULE:FREQ=WEEKLY');if(p.note)lines.push(`DESCRIPTION:${icsEscape(p.note)}`);lines.push('END:VEVENT')}lines.push('END:VCALENDAR');download('gavriel-family-calendar.ics',lines.join('\r\n'),'text/calendar')}
function nowTimeFrom(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function download(name,content,type){const b=new Blob([content],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderSettings(){const family=state.household;return `${header('Family settings','Invite both parents and keep a backup of your notes.')}<div class="grid two"><div class="card">${cardTitle('Shared access')}<p class="small muted">${CLOUD?'Both parents sign in with their own email. Membership controls private access.':'This is a local preview. Data entered here stays in this browser and does not sync.'}</p>${CLOUD&&family?`<div class="eyebrow" style="margin:15px 0 8px">Private family invite code</div><div class="codebox">${e(family.invite_code)}</div><div class="toolbar" style="margin-top:14px"><button class="button secondary small" data-action="copy-code">Copy code</button><button class="button secondary small" data-action="rotate-code">Reset code</button></div><p class="small muted" style="margin-top:13px">Share privately only with Miriam Rachel. Anyone with this code and a confirmed account may join.</p>`:`<div class="notice">To enable cloud sync, create a dedicated Supabase project and enter its URL and publishable key in config.js before deploying.</div>`}</div><div class="card">${cardTitle('Export & backups')}<p class="small muted">Export a private backup of your app records, or export a snapshot of scheduled events to Apple Calendar.</p><div class="stack"><button class="button secondary" data-action="export-json">Export full backup (.json)</button><button class="button secondary" data-action="export-ics">Export calendar (.ics)</button></div><div class="notice">Apple Calendar import is one-way and does not update automatically. Live parent-to-parent syncing happens inside this app when cloud mode is configured.</div></div></div><div class="card" style="margin-top:18px">${cardTitle('Privacy & safety')}<p class="small muted">Keep this application private. Behavior logs may contain sensitive information about a child. Do not share account links or invite codes publicly. Both parents should use their own logins and protect their phones with passcodes. The family hub does not replace professional assessment or emergency services.</p></div>`}
function render(){renderNav();let html=({home:renderHome,calendar:renderCalendar,screens:renderScreens,food:renderFood,needs:renderNeeds,incidents:renderIncidents,settings:renderSettings}[state.page]||renderHome)();$('#view').innerHTML=html}
function showModal(title,body,kind=''){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" data-action="close-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${e(title)}"><div class="modal-head"><h2>${e(title)}</h2><button class="close" aria-label="Close dialog" data-action="close">×</button></div>${body}</div></div>`;root.querySelector('input,select,textarea,button')?.focus()}
function closeModal(){$('#modalRoot').innerHTML=''}
function formFooter(action='Save',withDelete=false,id=''){return `<div class="form-actions">${withDelete?`<button type="button" class="button danger right" data-action="delete-record" data-id="${id}">Delete</button>`:''}<button type="button" class="button secondary" data-action="close">Cancel</button><button type="submit" class="button">${action}</button></div>`}
function scheduleModal(id='',date=state.selected){const x=id?itemById(id):null,p=x?.payload||{};showModal(id?'Edit schedule':'Add schedule event',`<form id="eventForm" data-id="${e(id)}"><div class="form-grid">${field('title','Event name',p.title,'required maxlength="110"',true)}${dropdown('category','Category',Object.entries(types),p.category||'school')}${dropdown('repeat','Repeat',[['none','One time'],['weekly','Every week']],p.repeat||'none')}${field('date','Starting date',p.date||date,'type="date" required')}${field('time','Start time',p.time||'','type="time"')}${field('end_time','End time (optional)',p.end_time||'','type="time"')}${field('note','Notes / preparation',p.note||'','placeholder="e.g., 5-minute warning before leaving"',true,'textarea')}</div>${formFooter('Save event',Boolean(id),id)}</form>`)}
function screenModal(){if(getActive()){toast('Finish the current session first.');return}showModal('Start a device session',`<form id="screenForm"><div class="callout"><strong>Agree first</strong><p class="small">Tell Gavriel the end time before handing over the device. A visual countdown stays visible on both phones.</p></div><div class="form-grid" style="margin-top:18px">${dropdown('game','Activity',[['FIFA','FIFA'],['Other game','Other game'],['YouTube / video','YouTube / video'],['Other device','Other device']],'FIFA')}${dropdown('minutes','Duration',[['10','10 minutes'],['15','15 minutes'],['20','20 minutes'],['30','30 minutes (trial)'],['40','40 minutes'],['45','45 minutes'],['60','60 minutes']],'30')}</div>${formFooter('Start countdown')}</form>`)}
function foodModal(id=''){const x=id?itemById(id):null,p=x?.payload||{};showModal(id?'Edit food':'Add food or meal',`<form id="foodForm" data-id="${e(id)}"><div class="form-grid">${field('name','Food / meal',p.name||'','required maxlength="100"',true)}${dropdown('category','Category',[['safe','Reliable food'],['meal','Meal idea'],['try','Food to explore'],['avoid','Avoid / allergy']],p.category||'safe',true)}${field('notes','Preferences, ingredients, preparation, or confirmed allergies',p.notes||'','maxlength="1000"',true,'textarea')}</div>${formFooter('Save food',Boolean(id),id)}</form>`)}
function needModal(id=''){const x=id?itemById(id):null,p=x?.payload||{};showModal(id?'Edit insight':'Add insight about Gavriel',`<form id="needForm" data-id="${e(id)}"><div class="form-grid">${field('name','Short title',p.name||'','required maxlength="120"',true)}${dropdown('category','Type',[['strength','Interest / strength'],['trigger','Possible trigger'],['support','What helps'],['communication','Communication preference']],p.category||'support',true)}${field('details','What have you actually observed?',p.details||'','maxlength="1600"',true,'textarea')}</div>${formFooter('Save insight',Boolean(id),id)}</form>`)}
function incidentModal(id=''){const x=id?itemById(id):null,p=x?.payload||{};showModal(id?'Edit observation':'Record an incident',`<form id="incidentForm" data-id="${e(id)}"><p class="small muted">Describe only what you observed, without labeling Gavriel as bad or assuming motives.</p><div class="form-grid">${field('date','Date',p.date||localISO(new Date()),'type="date" required')}${field('time','Time',p.time||nowTime(),'type="time"')}${dropdown('level','Severity',[['A · Light','A · Light'],['B · Painful','B · Painful'],['C · Injury','C · Injury'],['D · Unpredictable','D · Unpredictable']],p.level||'B · Painful')}${dropdown('target','Who was affected?', [['Sibling','Sibling'],['Parent','Parent'],['Other','Other'],['Nobody','Nobody']],p.target||'Sibling')}${field('before','What happened right before?',p.before||'','placeholder="Device transition, teasing, walking past, unclear…"',true,'textarea')}${field('behavior','What exactly happened?',p.behavior||'','required placeholder="Hit with open hand, shouted, threw object…"',true,'textarea')}${field('after','What happened right afterward?',p.after||'','placeholder="We separated the children; sibling moved away…"',true,'textarea')}${field('notes','Other context (sleep, noise, pain, hunger)',p.notes||'','',true,'textarea')}</div>${formFooter('Save observation',Boolean(id),id)}</form>`)}
function serialForm(f){return Object.fromEntries(new FormData(f).entries())}
async function save(kind,payload,id=''){if(state.busy)return;state.busy=true;try{if(CLOUD){let query;if(id){query=state.client.from('family_records').update({payload,updated_at:new Date().toISOString()}).eq('id',id).eq('household_id',state.household.id).select().single()}else{query=state.client.from('family_records').insert({household_id:state.household.id,kind,payload,created_by:state.user.id}).select().single()}const {data,error}=await query;if(error)throw error;state.items=id?state.items.map(x=>x.id===id?data:x):[data,...state.items]}else{const entry={id:id||uid(),kind,payload,updated_at:new Date().toISOString(),created_at:id?itemById(id)?.created_at:new Date().toISOString()};state.items=id?state.items.map(x=>x.id===id?entry:x):[entry,...state.items];saveDemo()}closeModal();render();toast('Saved successfully.')}catch(err){toast('Could not save: '+err.message)}finally{state.busy=false}}
async function remove(id){if(!confirm('Delete this record?'))return;try{if(CLOUD){const {error}=await state.client.from('family_records').delete().eq('id',id).eq('household_id',state.household.id);if(error)throw error}state.items=state.items.filter(x=>x.id!==id);if(!CLOUD)saveDemo();closeModal();render();toast('Record deleted.')}catch(err){toast(err.message)}}
function saveDemo(){try{localStorage.setItem(DEMO_KEY,JSON.stringify(state.items))}catch(err){toast('Browser storage is full. Export a backup.')}}
async function finishSession(id){const x=itemById(id);if(!x)return;await save('screen',{...x.payload,status:'finished',finished_at:new Date().toISOString()},id)}
function renderGate(mode='login'){state.gate=mode;$('#workspace').classList.add('hidden');$('#entryGate').classList.remove('hidden');const intro=`<div class="eyebrow">Private family access</div><h1>${mode==='login'?'Welcome to the family hub':mode==='setup'?'Set up your family':'Join your family'}</h1>`;let content;if(mode==='login'){content=`<p class="muted small">Sign in with your email. You and Miriam Rachel will each have a private login to the same shared schedule.</p><form id="emailForm">${field('email','Your email','','type="email" autocomplete="email" required',true)}<div class="form-actions"><button class="button" type="submit">Email me a sign-in link</button></div></form><p class="muted small">Check your inbox. This is a private app, not a public family website.</p>`}else if(mode==='setup'){content=`<p class="muted small">Create a new family space, or join the family your spouse already created.</p><form id="createFamilyForm">${field('name','Space name','Gavriel Family Hub','required maxlength="90"')}<div class="form-actions"><button type="submit" class="button">Create private family space</button></div></form><div class="divider"></div><button class="button secondary" data-action="show-join">I have an invite code</button>`}else{content=`<p class="muted small">Ask the other parent to copy the family invite code from Settings.</p><form id="joinFamilyForm">${field('code','Private invite code','','required minlength="32" maxlength="100"')}<div class="form-actions"><button type="button" class="button secondary" data-action="show-setup">Back</button><button class="button" type="submit">Join family</button></div></form>`}$('#entryGate').innerHTML=`<div class="gate-box">${intro}${content}</div>`}
async function initCloud(){setStatus('Connecting…');try{const lib=await import('https://esm.sh/@supabase/supabase-js@2.118.0');state.client=lib.createClient(CONFIG.supabaseUrl,CONFIG.supabasePublishableKey);const {data,error}=await state.client.auth.getSession();if(error)throw error;state.user=data.session?.user||null;state.client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT'){setTimeout(async()=>{state.user=session?.user||null;if(state.user)await loadFamily();else{state.household=null;renderGate('login')}},0)}});if(state.user)await loadFamily();else{renderGate('login');setStatus('Private login required')}}catch(err){setStatus('Connection problem','warning');renderGate('login');toast('Cloud setup issue: '+err.message)}}
async function loadFamily(){const {data,error}=await state.client.from('family_members').select('household_id').eq('user_id',state.user.id).limit(1);if(error)throw error;if(!data?.length){renderGate('setup');setStatus('Create or join family','warning');return}const {data:family,error:ferr}=await state.client.from('households').select('*').eq('id',data[0].household_id).single();if(ferr)throw ferr;state.household=family;$('#entryGate').classList.add('hidden');$('#workspace').classList.remove('hidden');$('#signoutBtn').classList.remove('hidden');setStatus('Shared • Cloud sync','connected');await refreshCloud();if(window.__familyChannel)state.client.removeChannel(window.__familyChannel);window.__familyChannel=state.client.channel('family-records-'+family.id).on('postgres_changes',{event:'*',schema:'public',table:'family_records',filter:`household_id=eq.${family.id}`},()=>{refreshCloud()}).subscribe()}
async function refreshCloud(){if(!CLOUD||!state.household)return;try{const {data,error}=await state.client.from('family_records').select('*').eq('household_id',state.household.id).order('created_at',{ascending:false});if(error)throw error;state.items=data;render();setStatus('Shared • Cloud sync','connected')}catch(err){setStatus('Sync unavailable','warning');console.error('Refresh error',err)}}
async function createFamily(name){const {data,error}=await state.client.from('households').insert({name,owner_id:state.user.id}).select().single();if(error)throw error;const {error:joinError}=await state.client.from('family_members').insert({household_id:data.id,user_id:state.user.id,role:'owner'});if(joinError)throw joinError;await loadFamily();toast('Family space created. Share the code in Settings.')}
async function joinFamily(code){const {error}=await state.client.rpc('join_household',{p_code:code.trim()});if(error)throw error;await loadFamily();toast('You joined the family space.')}
async function rotateCode(){if(!state.household||state.household.owner_id!==state.user.id){toast('Only the parent who created the family can reset the code.');return}if(!confirm('Reset the invite code? The old code will stop working.'))return;const newCode=uid().replaceAll('-','')+uid().replaceAll('-','');const {data,error}=await state.client.from('households').update({invite_code:newCode}).eq('id',state.household.id).select().single();if(error){toast(error.message);return}state.household=data;render();toast('Invite code changed.')}
function setupNavigation(){document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-action],[data-page]');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render();window.scrollTo(0,0);return}const a=b.dataset.action,id=b.dataset.id||'';try{switch(a){case'close':closeModal();break;case'close-backdrop':if(ev.target===b)closeModal();break;case'new-event':scheduleModal('',b.dataset.date||state.selected);break;case'edit-event':scheduleModal(id);break;case'new-session':screenModal();break;case'finish-session':await finishSession(id);break;case'new-food':foodModal();break;case'edit-food':foodModal(id);break;case'new-need':needModal();break;case'edit-need':needModal(id);break;case'new-incident':incidentModal();break;case'edit-incident':incidentModal(id);break;case'delete-record':await remove(id);break;case'month-prev':state.month.setMonth(state.month.getMonth()-1);render();break;case'month-next':state.month.setMonth(state.month.getMonth()+1);render();break;case'month-today':state.month=new Date(new Date().getFullYear(),new Date().getMonth(),1);state.selected=localISO(new Date());render();break;case'select-day':state.selected=b.dataset.date;render();break;case'export-json':exportJSON();break;case'export-ics':exportICS();break;case'copy-code':await navigator.clipboard.writeText(state.household.invite_code);toast('Invite code copied. Share it privately.');break;case'rotate-code':await rotateCode();break;case'show-join':renderGate('join');break;case'show-setup':renderGate('setup');break;default:break}}catch(err){toast(err.message)}});document.addEventListener('submit',async ev=>{const f=ev.target;if(!['eventForm','screenForm','foodForm','needForm','incidentForm','emailForm','createFamilyForm','joinFamilyForm'].includes(f.id))return;ev.preventDefault();if(state.busy)return;const d=serialForm(f);try{if(f.id==='eventForm'){if(d.end_time&&d.time&&d.end_time<=d.time){toast('End time must be after start time.');return}await save('schedule',d,f.dataset.id);return}if(f.id==='foodForm'){await save('food',d,f.dataset.id);return}if(f.id==='needForm'){await save('need',d,f.dataset.id);return}if(f.id==='incidentForm'){await save('incident',d,f.dataset.id);return}if(f.id==='screenForm'){const mins=Number(d.minutes),started=new Date(),ends=new Date(started.getTime()+mins*60000);await save('screen',{game:d.game,minutes:mins,status:'running',started_at:started.toISOString(),ends_at:ends.toISOString()});return}state.busy=true;if(f.id==='emailForm'){const {error}=await state.client.auth.signInWithOtp({email:d.email.trim(),options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;toast('Check your email for the sign-in link.')}if(f.id==='createFamilyForm')await createFamily(d.name.trim());if(f.id==='joinFamilyForm')await joinFamily(d.code)}catch(err){toast('Could not complete: '+err.message)}finally{state.busy=false}})}
async function init(){setupNavigation();$('#signoutBtn').addEventListener('click',async()=>{if(state.client)await state.client.auth.signOut();state.user=null;state.household=null;$('#signoutBtn').classList.add('hidden');renderGate('login')});if(!CLOUD){try{state.items=JSON.parse(localStorage.getItem(DEMO_KEY)||'[]')}catch{state.items=[]}state.mode='preview';render();setStatus('Preview • Not synced');}else await initCloud();setInterval(()=>{const a=getActive(),v=$('#liveTimer');if(a&&v){const sec=activeRemaining(a),dur=(new Date(a.payload.ends_at)-new Date(a.payload.started_at))/1000;if(sec<=0){v.textContent='Time is up';v.classList.add('expired')}else{v.textContent=timerText(sec)}const f=$('#timerFill');if(f)f.style.width=Math.max(0,Math.min(100,100*sec/dur))+'%'}},1000);setInterval(()=>{if(CLOUD&&state.household&&document.visibilityState==='visible')refreshCloud()},20000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CLOUD&&state.household)refreshCloud()});}
init();

</script>
</body></html>
